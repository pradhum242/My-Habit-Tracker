<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics · Pradhum's Habot Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-200 antialiased">
  <!-- Navbar -->
  <header class="sticky top-0 z-30 border-b border-slate-800 bg-slate-950/80 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
      <a href="index.html" class="flex items-center gap-2 text-lg font-bold tracking-tight">
        <span class="grid h-8 w-8 place-items-center rounded-xl bg-emerald-500 text-slate-950">
          <i data-lucide="list-checks" class="h-5 w-5"></i>
        </span>
        Pradhum's Habot <span class="text-emerald-400">Flow</span>
      </a>
      <nav class="flex items-center gap-1">
        <a href="index.html" class="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-400 transition hover:bg-slate-800 hover:text-white">Habits Log</a>
        <a href="analytics.html" class="nav-active rounded-lg px-3 py-1.5 text-sm font-medium text-slate-400 transition hover:bg-slate-800 hover:text-white">Analytics</a>
        <a href="todo.html" class="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-400 transition hover:bg-slate-800 hover:text-white">To-Do</a>
        <a href="notes.html" class="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-400 transition hover:bg-slate-800 hover:text-white">Notes</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-6">
    <div class="mb-6">
      <h1 class="text-2xl font-bold">Analytics</h1>
      <p class="text-sm text-slate-400">Your habit completion at a glance.</p>
    </div>

    <div class="grid gap-6 lg:grid-cols-[340px_minmax(0,1fr)]">
      <!-- Sidebar -->
      <aside class="rounded-2xl border border-slate-800 bg-slate-900/40 p-5">
        <div class="mb-4 flex items-center justify-between">
          <h2 class="font-semibold">Habits</h2>
          <span id="range-note" class="text-xs text-slate-500">This month to date</span>
        </div>

        <div id="habit-stats" class="space-y-3"></div>

        <div class="mt-5 rounded-xl border border-emerald-500/20 bg-emerald-500/5 p-4 text-center">
          <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-emerald-400/80">Total completion</p>
          <div class="relative mx-auto h-28 w-28">
            <div id="total-ring" class="h-full w-full"></div>
            <span id="total-pct" class="absolute inset-0 grid place-items-center text-2xl font-bold text-emerald-400">0%</span>
          </div>
        </div>
      </aside>

      <!-- Chart -->
      <section class="rounded-2xl border border-slate-800 bg-slate-900/40 p-5">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="font-semibold">Daily progress</h2>
            <p class="text-xs text-slate-500">Percentage of habits completed each day.</p>
          </div>
          <div class="flex items-center gap-1 rounded-xl bg-slate-800/60 p-1">
            <button class="tab rounded-lg px-3 py-1.5 text-sm font-medium text-slate-400 transition hover:text-white" data-range="week">This Week</button>
            <button class="tab tab-active rounded-lg px-3 py-1.5 text-sm font-medium text-slate-400 transition hover:text-white" data-range="month">This Month</button>
            <button class="tab rounded-lg px-3 py-1.5 text-sm font-medium text-slate-400 transition hover:text-white" data-range="full">Full Month</button>
          </div>
        </div>
        <div class="relative h-[380px] w-full">
          <canvas id="progressChart"></canvas>
        </div>
      </section>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
